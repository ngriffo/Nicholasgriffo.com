<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nicholas Griffo</title>
<link rel="stylesheet" href="https://use.typekit.net/jbi5gtg.css">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'adobe-caslon-pro', 'Caslon', serif;
    background-color: #000;
    color: #fff;
    border: 0.1in solid #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 40px 20px;
  }

  .byline {
    position: absolute;
    top: 18px;
    right: 24px;
    font-size: 0.7rem;
    color: rgba(255,255,255,0.75);
    font-style: italic;
  }

  .film-list {
    list-style: none;
    width: fit-content;
  }

  .film-list li {
    line-height: 1;
    margin-bottom: 46px;
  }

  .film-list li:last-child { margin-bottom: 0; }

  .film-link {
    display: block;
    color: #fff;
    text-decoration: none;
  }

  .film-title {
    display: block;
    font-size: 0.9em;
    transform: scaleY(4.5);
    transform-origin: left center;
    white-space: nowrap;
    text-align: left;
    text-shadow: 0 0 5px rgba(255,255,255,0.4);
    transition: text-shadow 0.4s;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  .film-link:hover .film-title {
    text-shadow:
      0 0 6px #fff,
      0 0 18px rgba(255,252,240,0.45),
      0 0 38px rgba(255,252,240,0.15);
  }

  @media (max-width: 600px) {
    .film-title { font-size: 0.65em; transform: scaleY(4.2); }
    .film-list li { margin-bottom: 26px; }
    .byline { font-size: 0.6rem; top: 14px; right: 16px; }
  }

</style>
</head>
<body>

  <p class="byline">Screenplays by Nicholas Griffo</p>

  <ul class="film-list">
    <li>
      <a class="film-link" href="mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20PENETRATION%20INGO%20SWANN&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27PENETRATION%20INGO%20SWANN%27.">
        <span class="film-title">PENETRATION INGO SWANN</span>
      </a>
    </li>
    <li>
      <a class="film-link" href="mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20The%20World%20is%20My%20Fuse&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27The%20World%20is%20My%20Fuse%27.">
        <span class="film-title">THE WORLD IS MY FUSE</span>
      </a>
    </li>
    <li>
      <a class="film-link" href="mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20Patterns%20of%20a%20Certain%20Scientific%20Bird&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27Patterns%20of%20a%20Certain%20Scientific%20Bird%27%20when%20it%20is%20finished.">
        <span class="film-title">PATTERNS OF A CERTAIN SCIENTIFIC BIRD</span>
      </a>
    </li>
    <li>
      <a class="film-link" href="mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20Bloody%20Knuckles&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27Bloody%20Knuckles%27%20when%20it%20is%20finished.">
        <span class="film-title">BLOODY KNUCKLES</span>
      </a>
    </li>
    <li>
      <a class="film-link" href="mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20Man's%20Creation&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27Man's%20Creation%27%20when%20it%20is%20finished.">
        <span class="film-title">MAN'S CREATION</span>
      </a>
    </li>
  </ul>

</body>
</html>
