    <style>
        body {
            font-family: '', serif;
            margin: 0;

        /* LOGLINE ZONE */
        .logline-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 26vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 60px 24px;
            box-sizing: border-box;
            pointer-events: none;
            text-align: center;
        }

        .logline-text {
            font-family: '', serif;
            font-size: .78rem;
            color: rgba(255,255,255,0);
            max-width: 620px;
            line-height: 1.7;
            transition: color .4s;
            margin: 0 0 14px;
        }

        .logline-text.visible {
            color: rgba(255,255,255,0.92);
            pointer-events: auto;
        }

        .logline-email {
            font-family: '', serif;
            font-size: .8rem;
            color: rgba(70,130,255,0);
            text-decoration: underline;
            pointer-events: none;
            transition: color .4s;
        }

        .logline-email.visible {
            color: rgb(70,130,255);
            pointer-events: auto;
        }

        @media (max-width: 600px) {
            body {
                width: 100%;
                max-width: none;
            }

            .stretched-text {
                font-size: 2em;
                transform: scaleY(6);
            }

            .logline-area { padding: 0 24px 18px; }
            .logline-text { font-size: .7rem; }
        }
    </style>

    <script>
        const films = {
            penetration: {
                text: "California, New York, Washington D.C. \u2014 1973.<br><br>Ingo Swann, CIA-funded psychic at the Stanford Research Institute, is contracted by a secretive military figure for his ability to remote-view \u2014 dangerous and experimental moon-spying.<br><br>Based on the memoir within Swann's 1998 book, 'Penetration: The Question of Extraterrestrial and Human Telepathy'",
                email: "mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20PENETRATION%20INGO%20SWANN&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27PENETRATION%20INGO%20SWANN%27."
            },
            fuse: {
                text: "Los Angeles, California.<br><br>Kevin Stranahan, former fraudster now commercial property flipper, seeks investment from old colleagues \u2014 inadvertently putting his business in the crosshairs of a group he once betrayed. Now they want him dead broke and humiliated.<br><br>A bad man against worse.",
                email: "mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20The%20World%20is%20My%20Fuse&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27The%20World%20is%20My%20Fuse%27."
            },
            patterns: {
                text: "Canyonlands \u2014 Moab, Utah.<br><br>A love story. A woman loves two men. They spend a season together in a fire-watch tower and witness hikers kidnapped by a wealthy cult under the pretense of finding crystals. This disturbs the nesting grounds of a certain scientific bird.",
                email: "mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20Patterns%20of%20a%20Certain%20Scientific%20Bird&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27Patterns%20of%20a%20Certain%20Scientific%20Bird%27%20when%20it%20is%20finished."
            },
            bloody: {
                text: "Wilmington, North Carolina.<br><br>A 27-year-old, clean from coke and pills, sets his life straight with a new job. He digs into old contracts \u2014 one belonging to a well-respected local official. He's dug too deep. Shadowy figures pursue him out of town, where a dark experience from his youth waits.",
                email: "mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20Bloody%20Knuckles&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27Bloody%20Knuckles%27%20when%20it%20is%20finished."
            },
            creation: {
                text: "Few hours southwest of Tulsa, Oklahoma.<br><br>A man's aunt dies suddenly, shocking her twin \u2014 his mother \u2014 into a coma. He stays to settle her affairs. A waitress likes him. Things just happen in the country. She gets pregnant. He tries to settle down. She grows obsessive. He grows restless. Her family grows jealous.",
                email: "mailto:film@nicholasgriffo.com?subject=Request%20for%20Script%20-%20Man's%20Creation&body=Please%20send%20me%20a%20copy%20of%20your%20screenplay,%20%27Man%27s%20Creation%27%20when%20it%20is%20finished."
            }
        };

        const loglineText  = document.getElementById('logline-text');
        const loglineEmail = document.getElementById('logline-email');
        let active = null;

        function clearLogline() {
            active = null;
            loglineText.classList.remove('visible');
            loglineEmail.classList.remove('visible');
            loglineText.innerHTML = '';
            loglineEmail.href = '#';
        }

        document.querySelectorAll('[data-film]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const key = this.dataset.film;

                if (active === key) { clearLogline(); return; }

                active = key;
                loglineText.innerHTML = films[key].text;
                loglineEmail.href = films[key].email;
                loglineText.classList.add('visible');
                loglineEmail.classList.add('visible');
            });
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('[data-film]') && !e.target.closest('.logline-area')) clearLogline();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') clearLogline();
        });
    </script>
