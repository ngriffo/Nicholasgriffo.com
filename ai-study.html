<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>AI Study Plan</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://use.typekit.net/jbi5gtg.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --fg: #fff;
      --dim: rgba(255,255,255,0.55);
      --faint: rgba(255,255,255,0.3);
      --line: rgba(255,255,255,0.12);
      --link: rgb(70,130,255);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'adobe-caslon-pro', 'Caslon', Georgia, serif;
      background: #000;
      color: var(--fg);
      border: 0.1in solid #fff;
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px 0;
      gap: 16px;
    }
    .nav a, .nav button {
      font-family: inherit;
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.3s;
    }
    .nav a:hover, .nav button:hover { color: rgba(255,255,255,0.8); }

    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 120px; }

    .byline {
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--faint);
    }
    h1 {
      font-weight: 400;
      text-align: center;
      font-size: 1.4rem;
      letter-spacing: 0.05em;
      transform: scaleY(2.4);
      margin: 34px 0 40px;
      text-shadow: 0 0 5px rgba(255,255,255,0.5);
    }
    .sub {
      text-align: center;
      font-style: italic;
      color: var(--dim);
      font-size: 0.95rem;
      max-width: 520px;
      margin: 0 auto;
    }

    /* progress */
    .progress { margin: 44px 0 12px; }
    .bar { height: 2px; background: var(--line); position: relative; }
    .bar > span { position: absolute; inset: 0 auto 0 0; background: #fff; box-shadow: 0 0 6px #fff; transition: width .5s; }
    .stats {
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim);
      margin-top: 10px;
    }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 22px; margin: 26px 0 0; }
    .btn {
      font-family: inherit; font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); background: none; border: none; border-bottom: 1px solid var(--faint);
      padding: 2px 0; cursor: pointer; text-decoration: none; transition: color .3s, border-color .3s;
    }
    .btn:hover { color: #fff; border-color: #fff; }
    .toast {
      text-align: center; font-style: italic; font-size: 0.85rem; color: var(--dim);
      min-height: 1.4em; margin-top: 12px;
    }

    /* phases */
    .phase { margin-top: 70px; }
    .phase-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      border-bottom: 1px solid var(--faint); padding-bottom: 8px; margin-bottom: 6px;
    }
    .phase-head h2 {
      font-weight: 400; font-size: 0.75rem; letter-spacing: 0.24em; text-transform: uppercase;
    }
    .phase-head .count { font-size: 0.65rem; letter-spacing: 0.14em; color: var(--dim); white-space: nowrap; }

    /* weeks */
    details.week { border-bottom: 1px solid var(--line); }
    details.week > summary {
      list-style: none; cursor: pointer; display: grid;
      grid-template-columns: 58px 1fr auto; gap: 12px; align-items: baseline;
      padding: 16px 0;
    }
    details.week > summary::-webkit-details-marker { display: none; }
    .tag { font-size: 0.65rem; letter-spacing: 0.18em; color: var(--dim); }
    .focus { font-size: 1.05rem; }
    .when { display: block; font-size: 0.78rem; font-style: italic; color: var(--dim); }
    .wk-count { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap; }
    details.week.done .focus { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--faint); }
    details.week.done .wk-count { color: #fff; }
    details.week.current > summary .tag { color: #fff; text-shadow: 0 0 6px #fff; }
    .now-pill {
      display: inline-block; margin-left: 8px; font-size: 0.55rem; letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid #fff; padding: 1px 6px; vertical-align: middle; font-style: normal;
    }

    ul.sessions { list-style: none; padding: 0 0 18px 70px; }
    ul.sessions li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 0; }
    ul.sessions li + li { border-top: 1px dashed var(--line); }

    input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; margin-top: 3px;
      border: 1px solid rgba(255,255,255,0.6); background: transparent; cursor: pointer;
      display: grid; place-content: center; transition: box-shadow .2s;
    }
    input[type=checkbox]::after { content: ""; width: 10px; height: 10px; background: #fff; transform: scale(0); transition: transform .15s; }
    input[type=checkbox]:checked::after { transform: scale(1); }
    input[type=checkbox]:checked { box-shadow: 0 0 6px rgba(255,255,255,0.7); }
    input[type=checkbox]:focus-visible { outline: 1px solid var(--link); outline-offset: 3px; }

    .s-day { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
    .s-title { font-size: 1rem; }
    label { cursor: pointer; }
    li.checked .s-title { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--faint); }
    .s-detail { font-size: 0.88rem; font-style: italic; color: var(--dim); margin-top: 2px; }
    .s-link { display: inline-block; margin-top: 4px; font-size: 0.8rem; color: var(--link); text-decoration: underline; word-break: break-all; }
    .s-link:hover { color: #9bb8ff; }

    .note-row {
      padding: 14px 0 14px 70px; border-bottom: 1px solid var(--line);
      font-size: 0.85rem; font-style: italic; color: var(--faint);
    }
    .note-row b { font-style: normal; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.62rem; margin-right: 8px; color: var(--dim); }

    .foot { margin-top: 70px; text-align: center; font-size: 0.8rem; font-style: italic; color: var(--faint); }

    @media (max-width: 600px) {
      .nav { padding: 14px 16px 0; }
      .wrap { padding: 36px 16px 90px; }
      h1 { font-size: 1.1rem; }
      details.week > summary { grid-template-columns: 44px 1fr auto; gap: 8px; }
      ul.sessions { padding-left: 0; }
      .note-row { padding-left: 52px; }
    }
  </style>
</head>

    const KEY = "ai-study-progress-v1";
    const ids = [];
    PLAN.forEach(w => { if (w.kind === "week") w.sessions.forEach((_, i) => ids.push(w.id + "-" + i)); });

    let done = new Set();
    try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

    // Sync link: progress encoded as a bitset in the URL hash (#p=...)
    function encode() {
      const bytes = new Uint8Array(Math.ceil(ids.length / 8));
      ids.forEach((id, n) => { if (done.has(id)) bytes[n >> 3] |= 1 << (n & 7); });
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function decode(s) {
      const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
      const set = new Set();
      ids.forEach((id, n) => { if ((bin.charCodeAt(n >> 3) || 0) & (1 << (n & 7))) set.add(id); });
      return set;
    }
    const m = location.hash.match(/^#p=([A-Za-z0-9_-]+)/);
    if (m) {
      try {
        const incoming = decode(m[1]);
        if (confirm("Load " + incoming.size + " checked sessions from this sync link? This replaces the checkmarks saved in this browser.")) {
          done = incoming; save();
        }
      } catch (e) {}
      history.replaceState(null, "", location.pathname);
    }

    const fmt = (iso, opts) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", opts);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const weekOf = iso => { const d = new Date(iso + "T00:00:00"); const end = new Date(d); end.setDate(d.getDate() + 7); return [d, end]; };
    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    const plan = document.getElementById("plan");
    let phaseEl = null, phaseName = null, currentEl = null, firstOpenEl = null;
    const phases = {};

    PLAN.forEach(w => {
      const [start, end] = weekOf(w.monday);
      const isNow = today >= start && today < end;

      if (w.kind === "week" && w.phase !== phaseName) {
        phaseName = w.phase;
        const sec = document.createElement("section");
        sec.className = "phase";
        sec.innerHTML = `<div class="phase-head"><h2>${esc(w.phase)}</h2><span class="count"></span></div>`;
        plan.appendChild(sec);
        phaseEl = sec;
        phases[w.phase] = { el: sec.querySelector(".count"), ids: [] };
      }
      if (!phaseEl) return;

      if (w.kind !== "week") {
        const row = document.createElement("div");
        row.className = "note-row";
        row.innerHTML = w.kind === "rest"
          ? `<b>Rest</b>${esc(w.label)}, week of ${fmt(w.monday, { month: "short", day: "numeric", year: "numeric" })}. No sessions.`
          : `<b>Buffer</b>Week of ${fmt(w.monday, { month: "short", day: "numeric", year: "numeric" })}. Catch up on anything unfinished, review, or rest.`;
        if (isNow) { row.style.color = "#fff"; currentEl = currentEl || row; }
        phaseEl.appendChild(row);
        return;
      }

      const det = document.createElement("details");
      det.className = "week" + (isNow ? " current" : "");
      det.id = w.id;
      const range = fmt(w.sessions[0].date, { month: "short", day: "numeric" }) + " – " +
                    fmt(w.sessions[3].date, { month: "short", day: "numeric", year: "numeric" });
      det.innerHTML = `
        <summary>
          <span class="tag">${w.tag}</span>
          <span><span class="focus">${esc(w.focus)}</span>
            <span class="when">${range}${isNow ? '<span class="now-pill">This week</span>' : ""}</span></span>
          <span class="wk-count"></span>
        </summary>
        <ul class="sessions">
          ${w.sessions.map((s, i) => {
            const id = w.id + "-" + i;
            return `<li data-id="${id}">
              <input type="checkbox" id="c-${id}" aria-label="${esc(s.title)}">
              <div>
                <label for="c-${id}"><span class="s-day">${fmt(s.date, { weekday: "short", month: "short", day: "numeric" })}</span><br>
                <span class="s-title">${esc(s.title)}</span></label>
                <p class="s-detail">${esc(s.detail)}</p>
                ${s.link ? `<a class="s-link" href="${s.link}" target="_blank" rel="noopener">${esc(s.link.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : ""}
              </div>
            </li>`;
          }).join("")}
        </ul>`;
      phaseEl.appendChild(det);
      phases[w.phase].ids.push(...w.sessions.map((_, i) => w.id + "-" + i));
      if (isNow) currentEl = det;
    });

    function weekIds(det) { return [...det.querySelectorAll("li[data-id]")].map(li => li.dataset.id); }

    function refresh() {
      document.querySelectorAll("li[data-id]").forEach(li => {
        const on = done.has(li.dataset.id);
        li.classList.toggle("checked", on);
        li.querySelector("input").checked = on;
      });
      document.querySelectorAll("details.week").forEach(det => {
        const ws = weekIds(det), n = ws.filter(id => done.has(id)).length;
        det.querySelector(".wk-count").textContent = n + "/" + ws.length;
        det.classList.toggle("done", n === ws.length);
      });
      Object.values(phases).forEach(p => {
        const n = p.ids.filter(id => done.has(id)).length;
        p.el.textContent = n + " / " + p.ids.length;
      });
      const n = ids.filter(id => done.has(id)).length;
      const pct = Math.round(n / ids.length * 100);
      document.getElementById("bar").style.width = pct + "%";
      document.getElementById("stat-done").textContent = n + " of " + ids.length + " sessions";
      document.getElementById("stat-pct").textContent = pct + "%";
      applyHide();
    }

    plan.addEventListener("change", e => {
      const li = e.target.closest("li[data-id]");
      if (!li) return;
      e.target.checked ? done.add(li.dataset.id) : done.delete(li.dataset.id);
      save(); refresh();
    });

    // Open the current week (or the first unfinished one before the plan starts)
    const firstUnfinished = [...document.querySelectorAll("details.week")].find(d => weekIds(d).some(id => !done.has(id)));
    const target = (currentEl && currentEl.tagName === "DETAILS") ? currentEl : (currentEl || firstUnfinished);
    if (target && target.tagName === "DETAILS") target.open = true;
    else if (firstUnfinished) firstUnfinished.open = true;

    document.getElementById("jump-top").addEventListener("click", () => {
      const t = currentEl || firstUnfinished;
      if (t) { if (t.tagName === "DETAILS") t.open = true; t.scrollIntoView({ block: "start" }); }
    });

    const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; clearTimeout(toast.t); toast.t = setTimeout(() => t.textContent = "", 4000); };

    document.getElementById("sync").addEventListener("click", async () => {
      const url = location.origin + location.pathname + "#p=" + encode();
      try { await navigator.clipboard.writeText(url); toast("Sync link copied. Open it on your other device."); }
      catch (e) { prompt("Copy this link and open it on your other device:", url); }
    });

    let hideDone = false;
    try { hideDone = localStorage.getItem(KEY + "-hide") === "1"; } catch (e) {}
    function applyHide() {
      document.querySelectorAll("details.week").forEach(d => d.hidden = hideDone && d.classList.contains("done"));
      document.getElementById("toggle-done").textContent = hideDone ? "Show finished weeks" : "Hide finished weeks";
    }
    document.getElementById("toggle-done").addEventListener("click", () => {
      hideDone = !hideDone;
      try { localStorage.setItem(KEY + "-hide", hideDone ? "1" : "0"); } catch (e) {}
      applyHide();
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (confirm("Clear every checkmark in this browser?")) { done.clear(); save(); refresh(); toast("Progress cleared."); }
    });

    // Calendar file, built from the plan above
    function buildIcs() {
      const ymd = d => d.toISOString().slice(0, 10).replace(/-/g, "");
      const day = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d; };
      const icsEsc = s => s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
      const fold = line => {
        const out = []; let cur = "", lim = 75;
        for (const ch of line) {
          const len = new TextEncoder().encode(ch).length;
          if (new TextEncoder().encode(cur).length + len > lim) { out.push(cur); cur = ""; lim = 74; }
          cur += ch;
        }
        out.push(cur);
        return out.join("\r\n ");
      };
      const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//AI Study Plan//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:AI Study Plan"];
      let n = 0;
      const ev = (d, sh, eh, summary, desc, free) => {
        L.push("BEGIN:VEVENT", `UID:ai-study-${ymd(d)}-${n++}@nicholasgriffo.com`, "DTSTAMP:20261117T000000Z");
        if (sh === null) L.push(`DTSTART;VALUE=DATE:${ymd(d)}`, `DTEND;VALUE=DATE:${ymd(new Date(d.getTime() + 5 * 864e5))}`);
        else L.push(`DTSTART:${ymd(d)}T${sh}0000`, `DTEND:${ymd(d)}T${eh}0000`);
        L.push(`SUMMARY:${icsEsc(summary)}`, `DESCRIPTION:${icsEsc(desc)}`, `TRANSP:${free ? "TRANSPARENT" : "OPAQUE"}`);
        if (!free && sh !== null) L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:AI study in 15 minutes", "TRIGGER:-PT15M", "END:VALARM");
        L.push("END:VEVENT");
      };
      const page = location.origin + location.pathname;
      PLAN.forEach(w => {
        if (w.kind === "rest") { ev(day(w.monday, 0), null, null, `AI study: ${w.label} (no sessions)`, "Rest week. No study sessions this week.", true); return; }
        let usesFriday = false;
        if (w.kind === "buffer") {
          ["Catch-up", "Catch-up", "Review", "Rest or light review"].forEach((t, i) =>
            ev(day(w.monday, i), 19, 21, `AI Buffer: ${t}`, `Buffer week. Catch up on anything unfinished, review, or rest.\n\n${page}`, false));
        } else {
          w.sessions.forEach(s => {
            const d = day(s.date, 0);
            if (d.getUTCDay() === 5) usesFriday = true;
            ev(d, 19, 21, `AI ${w.tag}: ${s.title}`, `${w.phase} | ${w.tag}: ${w.focus}\n\n${s.detail}${s.link ? "\n\n" + s.link : ""}\n\nCheck it off: ${page}#${w.id}`, false);
          });
        }
        if (!usesFriday) ev(day(w.monday, 4), 19, 20, "AI buffer (optional, only if behind)", "Optional. Use this hour only if you fell behind this week. Otherwise, take the night off.", true);
      });
      L.push("END:VCALENDAR");
      return L.map(fold).join("\r\n") + "\r\n";
    }
    document.getElementById("ics").addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([buildIcs()], { type: "text/calendar" }));
      const a = document.createElement("a");
      a.href = url; a.download = "ai-study-plan.ics";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    if (location.hash && !m) {
      const t = document.getElementById(location.hash.slice(1));
      if (t && t.tagName === "DETAILS") { t.open = true; setTimeout(() => t.scrollIntoView({ block: "start" }), 0); }
    }

    refresh();
  </script>
</body>
</html>
